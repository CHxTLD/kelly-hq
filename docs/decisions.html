  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r list=\"{{ detail.log }}\" as=\"l\" hint-placeholder-count=\"0\">\n            <div style=\"{{ l.wrapStyle }}\">\n              <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px\">\n                <span style=\"font-size:12px;font-weight:700\">{{ l.who }}<\u002Fspan>\n                <span style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--hot);font-weight:600\">{{ l.role }}<\u002Fspan>\n                <div style=\"flex:1;min-width:6px\"><\u002Fdiv>\n                <span style=\"font-size:10px;color:#888;white-space:nowrap\">{{ l.at }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;color:#222;text-wrap:pretty\">{{ l.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;align-items:flex-end\">\n          <textarea ref=\"{{ commentRef }}\" placeholder=\"Add to the discussion…\" rows=\"2\" style=\"flex:1;font-family:inherit;font-size:13px;padding:9px 11px;border:1.5px solid #000;border-radius:6px;resize:vertical;background:#fff;color:#000;min-height:44px\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ postComment }}\" style=\"background:#000;color:#fff;border:1.5px solid #000;border-radius:6px;padding:0 16px;height:44px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;flex-shrink:0;transition:background 0.2s ease\" style-hover=\"background:#e38d54;border-color:#e38d54\">post<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1.5px solid rgba(0,0,0,0.18);flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ detail.resolveWithLeader }}\" style=\"{{ detail.resolveStyle }}\" style-hover=\"background:#4a7a4e;color:#fff;border-color:#4a7a4e\">{{ detail.resolveLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ detail.toggleBlocked }}\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);background:transparent;color:#b4453a;border:1.5px solid #b4453a;border-radius:6px;padding:0 18px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;transition:background 0.2s ease\" style-hover=\"background:#b4453a;color:#fff\">{{ detail.blockLabel }}<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <a href=\"{{ detail.sheetUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;align-self:center\">open in matrix ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"{{ detail.statusMsgStyle }}\">{{ detail.statusMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── NUMBER EDIT SHEET ─────────────────────────────────────────── -->\n<sc-if value=\"{{ numEdit }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeNum }}\" style=\"position:fixed;inset:0;z-index:95;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:340px;background:#fff;border:2px solid #000;border-radius:10px;padding:20px\">\n      <div style=\"font-size:10px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:var(--hot);margin-bottom:3px\">{{ numEdit.scope }}<\u002Fdiv>\n      <div style=\"font-size:19px;font-style:italic;margin-bottom:14px\">{{ numEdit.label }}<\u002Fdiv>\n      <input ref=\"{{ numRef }}\" type=\"text\" inputmode=\"decimal\" style=\"width:100%;font-family:inherit;font-size:22px;font-weight:600;padding:10px 12px;border:1.5px solid #000;border-radius:6px;background:#fff;color:#000;margin-bottom:14px\">\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ saveNum }}\" style=\"flex:1;min-height:var(--tap);background:#000;color:#fff;border:1.5px solid #000;border-radius:6px;padding:0 12px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;transition:background 0.2s ease\" style-hover=\"background:#e38d54;border-color:#e38d54\">save to matrix<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeNum }}\" style=\"min-height:var(--tap);background:transparent;color:#000;border:1.5px solid #000;border-radius:6px;padding:0 17px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── IDENTITY ──────────────────────────────────────────────────── -->\n<sc-if value=\"{{ identityOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.68);display:flex;align-items:center;justify-content:center;padding:20px\">\n    <div style=\"width:100%;max-width:360px;background:#fff;border:2px solid #000;border-radius:10px;padding:24px\">\n      <h2 style=\"margin:0 0 5px;font-size:25px;font-weight:400;font-style:italic\">Who's deciding?<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:12px;color:var(--dim);text-wrap:pretty\">Your name is stamped on every vote, comment, and value you change — so the team can see who moved what.<\u002Fp>\n      <input ref=\"{{ nameRef }}\" type=\"text\" placeholder=\"Your name\" style=\"width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1.5px solid #000;border-radius:6px;margin-bottom:9px;background:#fff;color:#000\">\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px\">\n        <sc-for list=\"{{ roleChoices }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ saveIdentity }}\" style=\"width:100%;min-height:var(--tap);background:#000;color:#fff;border:1.5px solid #000;border-radius:6px;padding:0 12px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;transition:background 0.2s ease\" style-hover=\"background:#e38d54;border-color:#e38d54\">enter<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;scriptUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://script.google.com/macros/s/AKfycbxb6OprpFaSnmV3SWKesKsjuG9ANJWqRUVhUxJInstZ0Wvn7P1FA4KBxeLpXQVu2tR5fQ/exec&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Data source&quot;},\n  &quot;sheetId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1PvtRF8jVLn5vA1AmdXDMBkbMdZ2un91n1zDwCKzIQck&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Data source&quot;},\n  &quot;editPass&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Data source&quot;},\n  &quot;projectName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Kelly Residence&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Data source&quot;},\n  &quot;logoUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;assets/chxtld-logo-brand.png&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Brand&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    data: null, live: false, loaded: false, syncing: false,\n    filter: \"needs\",\n    openId: null,\n    numEdit: null,       // {id, option, field, label, scope, current}\n    identityOpen: false,\n    me: \"\", myRole: \"\",\n    logoFromConfig: \"\", nameFromConfig: \"\",\n    roleDraft: \"\",\n    statusMsg: \"\", statusKind: \"\"\n  };\n\n  // ── demo scaffold: shows the shape before the DECISIONS tab exists ──\n  _demo() {\n    return [\n      { id: \"D001\", title: \"Cedar lap siding grade\", question: \"Clear vertical grain reads tight and uniform with almost no knots. STK carries visible knots and more character, and the GC's number comes in materially lower on the same takeoff. Which grade do we carry into the CDs?\", discipline: \"architecture\", owner: \"client\", due: \"\", status: \"voting\", resolution: \"\", notes: \"\",\n        options: [\n          { option: \"A\", element: \"Clear vertical grain cedar lap, 1x6\", qty: 1240, unit: \"sf\", unitCost: 31, total: \"\", image: \"\", notes: \"N 430 sf · E 295 sf · S 385 sf · W 130 sf · GC installed price\" },\n          { option: \"B\", element: \"STK cedar lap, 1x6\", qty: 1240, unit: \"sf\", unitCost: 19.5, total: \"\", image: \"\", notes: \"N 430 sf · E 295 sf · S 385 sf · W 130 sf · GC installed price\" }\n        ],\n        log: [\n          { at: \"\", who: \"ch x tld\", role: \"architect\", type: \"comment\", value: \"Same takeoff on both — 1,240 sf off the four elevations. The delta is grade, not scope.\" },\n          { at: \"\", who: \"GC\", role: \"builder\", type: \"comment\", value: \"STK is holding at $19.50/sf installed. Clear is $31 and the lead time is four weeks longer right now.\" }\n        ] },\n      { id: \"D002\", title: \"Primary bath fixture package\", question: \"Confirm the fixture line so we can release the plumbing rough-in dimensions.\", discipline: \"interiors\", owner: \"client\", due: \"\", status: \"open\", resolution: \"\", notes: \"\",\n        options: [\n          { option: \"A\", element: \"Specified line, wall-mount lav\", qty: 3, unit: \"ea\", unitCost: 1850, total: \"\", image: \"\", notes: \"2 primary + 1 powder\" },\n          { option: \"B\", element: \"Value line, deck-mount lav\", qty: 3, unit: \"ea\", unitCost: 940, total: \"\", image: \"\", notes: \"2 primary + 1 powder\" }\n        ], log: [] }\n    ];\n  }\n\n  _url() { return (this.props.scriptUrl || \"\").trim(); }\n  _sheet() { return (this.props.sheetId || \"\").trim(); }\n  _cacheKey() { return \"hqDec:\" + (this._sheet() || \"default\"); }\n\n  _post(body, onDone) {\n    const url = this._url();\n    if (!url) { onDone(\"no backend — change is local only\"); return; }\n    fetch(url, { method: \"POST\", body: JSON.stringify({ ...body, sheet: this._sheet(), pass: (this.props.editPass || \"\").trim() }) })\n      .then((r) => r.json())\n      .then((res) => onDone(res && res.ok ? \"\" : \"matrix said no: \" + ((res && res.error) || \"unknown\")))\n      .catch(() => onDone(\"couldn't reach the matrix\"));\n  }\n\n  _flash(msg, kind) {\n    this.setState({ statusMsg: msg, statusKind: kind || (msg ? \"err\" : \"ok\") });\n    if (msg) setTimeout(() => this.setState({ statusMsg: \"\" }), 4200);\n  }\n\n  _loadCache() {\n    let d = null;\n    try {\n      const raw = localStorage.getItem(this._cacheKey());\n      if (raw) d = JSON.parse(raw);\n    } catch (ignored) {}\n    if (!d && typeof window !== \"undefined\" && window.HQ_DECISIONS) d = window.HQ_DECISIONS;\n    if (Array.isArray(d) && d.length) this.setState({ data: d, live: true, loaded: true });\n  }\n\n  _refetch() {\n    const url = this._url();\n    if (!url) return;\n    const sep = url.indexOf(\"?\") >= 0 ? \"&\" : \"?\";\n    this.setState({ syncing: true });\n    fetch(url + sep + \"type=decisions&sheet=\" + encodeURIComponent(this._sheet()) + \"&nocache=1&_=\" + Date.now(), { cache: \"no-store\" })\n      .then((r) => r.json())\n      .then((d) => {\n        if (d && Array.isArray(d.decisions)) {\n          try { localStorage.setItem(this._cacheKey(), JSON.stringify(d.decisions)); } catch (ignored) {}\n          this.setState({ data: d.decisions, live: true, loaded: true, syncing: false });\n        } else this.setState({ syncing: false });\n      })\n      .catch(() => this.setState({ syncing: false }));\n  }\n\n  componentDidMount() {\n    try {\n      this.setState({\n        me: localStorage.getItem(\"hqWho\") || \"\",\n        myRole: localStorage.getItem(\"hqRole\") || \"\",\n        roleDraft: localStorage.getItem(\"hqRole\") || \"\"\n      }, () => { if (!this.state.me) this.setState({ identityOpen: true }); });\n    } catch (ignored) {}\n    this.setState({ data: this._demo() });\n    this._loadCache();\n    this._refetch();\n    this._loadBrand();\n    this._poll = setInterval(() => this._refetch(), 30000);\n    this._onFocus = () => this._refetch();\n    window.addEventListener(\"focus\", this._onFocus);\n    this._onKey = (e) => {\n      if (e.key !== \"Escape\") return;\n      if (this.state.numEdit) this.setState({ numEdit: null });\n      else if (this.state.openId) this.setState({ openId: null });\n    };\n    document.addEventListener(\"keydown\", this._onKey);\n  }\n\n  /* One light call for CONFIG so the logo and project name match the HQ page. */\n  _loadBrand() {\n    const url = this._url();\n    if (!url) return;\n    try {\n      const cached = JSON.parse(localStorage.getItem(\"hqDecBrand:\" + this._sheet()) || \"null\");\n      if (cached && cached.logo) this.setState({ logoFromConfig: cached.logo, nameFromConfig: cached.name || \"\" });\n    } catch (ignored) {}\n    const sep = url.indexOf(\"?\") >= 0 ? \"&\" : \"?\";\n    fetch(url + sep + \"type=config&sheet=\" + encodeURIComponent(this._sheet()))\n      .then((r) => r.json())\n      .then((d) => {\n        const cfg = (d && d.config) || {};\n        const brand = { logo: cfg.logo_url || \"\", name: cfg.project_name || \"\" };\n        if (!brand.logo && !brand.name) return;\n        try { localStorage.setItem(\"hqDecBrand:\" + this._sheet(), JSON.stringify(brand)); } catch (ignored) {}\n        this.setState({ logoFromConfig: brand.logo, nameFromConfig: brand.name });\n      })\n      .catch(() => {});\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._poll);\n    window.removeEventListener(\"focus\", this._onFocus);\n    document.removeEventListener(\"keydown\", this._onKey);\n  }\n\n  // ── helpers ──\n  // state.data is the single source of truth — seeded with demo rows on mount,\n  // replaced wholesale by a live payload. Optimistic writes must survive here,\n  // so this never rebuilds _demo(). Honesty about demo vs live is the `live`\n  // flag's job (it drives the badge), not this function's.\n  _list() {\n    return Array.isArray(this.state.data) ? this.state.data : [];\n  }\n\n  _money(n) {\n    if (n === \"\" || n === null || n === undefined || isNaN(Number(n))) return \"—\";\n    return \"$\" + Math.round(Number(n)).toLocaleString();\n  }\n\n  // Unit costs are often $19.50 — never round those away.\n  _unitMoney(n) {\n    if (n === \"\" || n === null || n === undefined || isNaN(Number(n))) return \"cost\";\n    const v = Number(n);\n    return \"$\" + (v % 1 === 0 ? v.toLocaleString() : v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));\n  }\n\n  _statusStyle(status) {\n    const c = { open: \"#555555\", voting: \"#e38d54\", blocked: \"#b4453a\", resolved: \"#4a7a4e\" }[status] || \"#555555\";\n    return \"font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#fff;background:\" + c + \";padding:3px 8px;border-radius:3px;white-space:nowrap\";\n  }\n\n  _optTotal(o) {\n    if (o.total !== \"\" && !isNaN(Number(o.total)) && Number(o.total)) return Number(o.total);\n    const q = Number(o.qty) || 0, c = Number(o.unitCost) || 0;\n    return q * c;\n  }\n\n  _votes(d) {\n    const tally = {};\n    (d.log || []).forEach((l) => {\n      if (l.type !== \"vote\") return;\n      const k = String(l.value).trim();\n      if (!tally[k]) tally[k] = [];\n      if (tally[k].indexOf(l.who) < 0) tally[k].push(l.who);\n    });\n    return tally;\n  }\n\n  _leader(d) {\n    const t = this._votes(d);\n    let best = \"\", n = 0;\n    Object.keys(t).forEach((k) => { if (t[k].length > n) { n = t[k].length; best = k; } });\n    return best;\n  }\n\n  // ── writes ──\n  _vote(d, label) {\n    if (!this.state.me) { this.setState({ identityOpen: true }); return; }\n    const next = { ...d, log: [...(d.log || []), { at: \"just now\", who: this.state.me, role: this.state.myRole, type: \"vote\", value: label }] };\n    this._patch(next);\n    if (d.status === \"open\") this._patchField(d.id, \"STATUS\", \"voting\");\n    this._post({ action: \"postDecisionLog\", id: d.id, who: this.state.me, role: this.state.myRole, type: \"vote\", value: label },\n      (err) => { this._flash(err); if (!err) this._refetch(); });\n  }\n\n  _patch(next) {\n    const cur = this._list();\n    this.setState({ data: cur.map((x) => (x.id === next.id ? next : x)) });\n  }\n\n  _patchField(id, field, value) {\n    const key = { STATUS: \"status\", RESOLUTION: \"resolution\" }[field];\n    const cur = this._list();\n    if (key) this.setState({ data: cur.map((x) => (x.id === id ? { ...x, [key]: value } : x)) });\n    this._post({ action: \"setDecisionField\", id, field, value, who: this.state.me, role: this.state.myRole },\n      (err) => { this._flash(err); if (!err) this._refetch(); });\n  }\n\n  renderVals() {\n    const L = this._list();\n    const me = this.state.me;\n    const counts = { all: L.length };\n    [\"open\", \"voting\", \"blocked\", \"resolved\"].forEach((s) => { counts[s] = L.filter((d) => d.status === s).length; });\n    // \"Needs a call\" = anything still unresolved and unblocked, so a decision\n    // that's already collecting votes doesn't disappear from the default view.\n    counts.needs = (counts.open || 0) + (counts.voting || 0);\n\n    const filters = [\n      { key: \"needs\", label: \"Needs a call\", short: \"needs\" },\n      { key: \"voting\", label: \"Voting\", short: \"voting\" },\n      { key: \"blocked\", label: \"Blocked\", short: \"blocked\" },\n      { key: \"resolved\", label: \"Resolved\", short: \"resolved\" },\n      { key: \"all\", label: \"Everything\", short: \"all\" }\n    ].map((f) => {\n      const on = this.state.filter === f.key;\n      const n = counts[f.key] || 0;\n      return {\n        label: f.label + (n ? \"  \" + n : \"\"),\n        short: f.short,\n        count: n ? String(n) : \"\",\n        onClick: () => this.setState({ filter: f.key }),\n        style: \"display:inline-flex;align-items:center;min-height:var(--tap);flex-shrink:0;scroll-snap-align:start;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0 17px;border-radius:999px;white-space:nowrap;transition:background 0.2s ease,color 0.2s ease;border:1.5px solid #000;\" +\n          (on ? \"background:#000;color:#fff\" : \"background:transparent;color:#000\"),\n        // HQ's bottom nav: flat, borderless, orange marks the active chapter\n        botStyle: \"flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tap);padding:4px 2px;background:transparent;border:none;cursor:pointer;font-family:inherit\",\n        botCountStyle: \"font-size:13px;font-weight:700;line-height:1.1;color:\" + (on ? \"#e38d54\" : \"#000\") + \";opacity:\" + (n ? \"1\" : \"0.28\"),\n        botTextStyle: \"font-size:8.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:\" + (on ? \"#e38d54\" : \"#555\")\n      };\n    });\n\n    const shown = this.state.filter === \"all\" ? L\n      : this.state.filter === \"needs\" ? L.filter((d) => d.status === \"open\" || d.status === \"voting\")\n      : L.filter((d) => d.status === this.state.filter);\n\n    const cards = shown.map((d, i) => {\n      const totals = (d.options || []).map((o) => this._optTotal(o)).filter((n) => n > 0);\n      const spread = totals.length > 1 ? Math.max(...totals) - Math.min(...totals) : 0;\n      const votes = this._votes(d);\n      const voteN = Object.keys(votes).reduce((a, k) => a + votes[k].length, 0);\n      const comN = (d.log || []).filter((l) => l.type === \"comment\").length;\n      const bits = [];\n      if (voteN) bits.push(voteN + (voteN === 1 ? \" vote\" : \" votes\"));\n      if (comN) bits.push(comN + (comN === 1 ? \" comment\" : \" comments\"));\n      return {\n        id: d.id,\n        title: d.title,\n        question: d.question,\n        discipline: d.discipline,\n        statusLabel: d.status,\n        statusStyle: this._statusStyle(d.status),\n        dueLabel: d.due ? \"due \" + d.due : \"\",\n        dueStyle: \"font-size:11px;font-weight:600;white-space:nowrap;color:\" + (d.due ? \"#b4453a\" : \"transparent\"),\n        optLabel: (d.options || []).length ? (d.options || []).length + \" options\" : \"no options yet\",\n        spreadLabel: spread ? this._money(spread) + \" spread\" : \"\",\n        spreadStyle: \"font-size:11px;font-weight:700;color:var(--hot);white-space:nowrap;display:\" + (spread ? \"inline\" : \"none\"),\n        activityLabel: bits.join(\" · \"),\n        bandImages: (d.options || []).slice(0, 3).map((o) => ({\n          label: o.option,\n          // name what's missing rather than showing an anonymous dark band\n          cueLabel: o.image ? \"\" : \"photo pending\",\n          cueStyle: \"position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5);white-space:nowrap;display:\" + (o.image ? \"none\" : \"block\"),\n          style: \"position:relative;flex:1;min-width:0;background:\" +\n            (o.image\n              ? \"url('\" + o.image + \"') center/cover no-repeat\"\n              : \"repeating-linear-gradient(45deg,#3d3d3d,#3d3d3d 10px,#343434 10px,#343434 20px)\")\n        })),\n        // full-bleed photography behind an HQ-style 75% white plate\n        bandStyle: \"position:absolute;inset:0;display:flex;gap:2px;background:#343434;overflow:hidden\",\n        bodyStyle: \"position:relative;margin:auto 14px 14px;background:rgba(255,255,255,0.75);backdrop-filter:blur(3px);border:1.5px solid #000;border-radius:6px;padding:14px 16px;transition:background 0.25s ease,border-color 0.25s ease\",\n        onClick: () => this.setState({ openId: d.id, statusMsg: \"\" }),\n        style: \"position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:var(--cardh);background:#343434;border:2px solid #000;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.14);transition:transform 0.25s cubic-bezier(0.16,1,0.3,1),box-shadow 0.25s ease;animation:decrise 0.4s cubic-bezier(0.16,1,0.3,1) both;animation-delay:\" + (i * 55) + \"ms\"\n      };\n    });\n\n    // image-slot can only persist a drop through the host bridge; without it the\n    // component is read-only (see image-slot.js), so don't offer the affordance.\n    const canDrop = !!(typeof window !== \"undefined\" && window.omelette && window.omelette.writeFile);\n\n    const d = L.filter((x) => x.id === this.state.openId)[0] || null;\n    let detail = null;\n    if (d) {\n      const votes = this._votes(d);\n      const leader = this._leader(d);\n      const totals = (d.options || []).map((o) => this._optTotal(o)).filter((n) => n > 0);\n      const low = totals.length ? Math.min(...totals) : 0;\n      detail = {\n        id: d.id, title: d.title, question: d.question, discipline: d.discipline,\n        owner: d.owner || \"unassigned\",\n        statusLabel: d.status,\n        statusStyle: this._statusStyle(d.status),\n        dueLabel: d.due ? \"due \" + d.due : \"no date set\",\n        resolution: d.resolution || \"\",\n        sheetUrl: this._sheet() ? \"https://docs.google.com/spreadsheets/d/\" + this._sheet() + \"/edit\" : \"\",\n        options: (d.options || []).map((o) => {\n          const total = this._optTotal(o);\n          const delta = low && total ? total - low : 0;\n          const voters = votes[o.option] || [];\n          const mine = voters.indexOf(me) >= 0;\n          const picked = leader && leader === o.option && voters.length > 0;\n          return {\n            option: o.option,\n            element: o.element || \"—\",\n            qtyLabel: (o.qty === \"\" || o.qty === null || o.qty === undefined ? \"qty\" : Number(o.qty).toLocaleString()) + (o.unit ? \" \" + o.unit : \"\"),\n            costLabel: this._unitMoney(o.unitCost),\n            totalLabel: this._money(total),\n            deltaLabel: delta ? \"+\" + this._money(delta) : \"\",\n            deltaStyle: \"font-size:11px;font-weight:700;color:#b4453a;white-space:nowrap;display:\" + (delta ? \"inline\" : \"none\"),\n            pickedLabel: picked ? \"leading\" : \"\",\n            pickedStyle: \"font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#fff;background:#4a7a4e;padding:2px 6px;border-radius:3px;display:\" + (picked ? \"inline\" : \"none\"),\n            voteLabel: mine ? \"✓ your pick\" : \"pick this\",\n            voteStyle: \"display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0 20px;border-radius:6px;transition:background 0.2s ease,color 0.2s ease;border:1.5px solid \" +\n              (mine ? \"#4a7a4e;background:#4a7a4e;color:#fff\" : \"#000;background:transparent;color:#000\"),\n            voterLabel: voters.length ? voters.join(\", \") : \"\",\n            numStyle: \"display:inline-flex;align-items:center;min-height:var(--tap);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;padding:0 13px;border-radius:6px;border:1.5px dashed rgba(0,0,0,0.45);background:rgba(0,0,0,0.03);white-space:nowrap;transition:border-color 0.2s ease,background 0.2s ease\",\n            wrapStyle: \"background:#fff;display:flex;flex-direction:column;min-width:0\" + (picked ? \";box-shadow:inset 0 -4px 0 #4a7a4e\" : \"\"),\n            // No photo yet → a dark plate, so the white overlay type stays legible\n            // instead of vanishing into a light hatch.\n            // dark base under the photo: if a remote image fails, the white\n            // overlay type still has something to sit on\n            heroStyle: \"position:relative;width:100%;aspect-ratio:16/10;min-height:190px;background-color:#343434;background-image:\" +\n              (o.image\n                ? \"url('\" + o.image + \"')\"\n                : \"repeating-linear-gradient(45deg,#3d3d3d,#3d3d3d 10px,#343434 10px,#343434 20px)\") +\n              \";background-size:cover;background-position:center;background-repeat:no-repeat\",\n            // Sheet photo → CSS background. No photo: offer the drop target only\n            // where it actually works (the editor). On a share link there is no\n            // host bridge, so image-slot is read-only — show an honest pending\n            // state naming the real mechanism instead of a dead control.\n            showSlot: !o.image && canDrop,\n            showPending: !o.image && !canDrop,\n            pendingLabel: \"photo pending — add a Drive link in the IMAGE column\",\n            slotId: \"opt-\" + d.id + \"-\" + String(o.option).replace(/\\W+/g, \"\"),\n            slotPlaceholder: \"Drop a photo of \" + (o.element || \"this option\").toLowerCase(),\n            bigCostStyle: \"position:absolute;right:0;bottom:0;pointer-events:none;text-align:right;padding:12px 20px 11px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,0.72),rgba(0,0,0,0.28));border-top-left-radius:8px;display:\" + (total ? \"block\" : \"none\"),\n            bigCostCaption: delta ? \"+\" + this._money(delta) + \" vs lowest\" : totals.length > 1 ? \"lowest cost\" : \"installed\",\n            takeoffLabel: o.notes ? \"takeoff · \" + o.notes : \"\",\n            takeoffStyle: \"font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:0.02em;text-wrap:pretty;display:\" + (o.notes ? \"block\" : \"none\"),\n            editQty: () => this.setState({ numEdit: { id: d.id, option: o.option, field: \"QTY\", scope: \"option \" + o.option, label: \"Quantity\" + (o.unit ? \" (\" + o.unit + \")\" : \"\"), current: o.qty } }),\n            editCost: () => this.setState({ numEdit: { id: d.id, option: o.option, field: \"UNIT COST\", scope: \"option \" + o.option, label: \"Unit cost\", current: o.unitCost } }),\n            vote: () => this._vote(d, o.option)\n          };\n        }),\n        log: (d.log || []).filter((l) => l.type === \"comment\" || l.type === \"vote\" || l.type === \"edit\").slice(-24).map((l) => ({\n          who: l.who || \"—\",\n          role: l.role || \"\",\n          at: l.at || \"\",\n          value: l.type === \"vote\" ? \"picked option \" + l.value : l.type === \"edit\" ? \"changed \" + l.value : l.value,\n          wrapStyle: \"background:\" + (l.type === \"comment\" ? \"rgba(0,0,0,0.04)\" : \"transparent\") + \";border-left:2.5px solid \" +\n            (l.type === \"vote\" ? \"#4a7a4e\" : l.type === \"edit\" ? \"#e38d54\" : \"#000\") + \";border-radius:0 6px 6px 0;padding:8px 11px\"\n        })),\n        resolveLabel: leader ? \"resolve as option \" + leader : \"resolve\",\n        resolveStyle: \"display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0 18px;border-radius:6px;transition:background 0.2s ease,color 0.2s ease;border:1.5px solid #4a7a4e;background:transparent;color:#4a7a4e\",\n        resolveWithLeader: () => {\n          const pick = leader || (d.options && d.options[0] && d.options[0].option) || \"\";\n          if (!pick) { this._flash(\"nothing to resolve — add options first\"); return; }\n          const opt = (d.options || []).filter((o) => o.option === pick)[0];\n          const text = \"Option \" + pick + (opt && opt.element ? \" — \" + opt.element : \"\") + \" · \" + this._money(opt ? this._optTotal(opt) : \"\") + (me ? \" · resolved by \" + me : \"\");\n          this._patchField(d.id, \"RESOLUTION\", text);\n          setTimeout(() => this._patchField(d.id, \"STATUS\", \"resolved\"), 400);\n        },\n        blockLabel: d.status === \"blocked\" ? \"unblock\" : \"mark blocked\",\n        toggleBlocked: () => this._patchField(d.id, \"STATUS\", d.status === \"blocked\" ? \"open\" : \"blocked\"),\n        statusMsg: this.state.statusMsg,\n        statusMsgStyle: \"font-size:11px;font-weight:600;margin-top:10px;color:\" + (this.state.statusKind === \"err\" ? \"#b4453a\" : \"#4a7a4e\") + \";display:\" + (this.state.statusMsg ? \"block\" : \"none\")\n      };\n    }\n\n    const ne = this.state.numEdit;\n    const roles = [\"client\", \"architect\", \"consultant\", \"builder\"];\n\n    return {\n      projectName: this.state.nameFromConfig || this.props.projectName || \"Kelly Residence\",\n      logoStyle: (() => {\n        // CONFIG's logo_url wins when live; otherwise fall through to the\n        // stylesheet's --logo-fallback, which the bundler inlines so the mark\n        // survives in the standalone file.\n        const url = (this.state.logoFromConfig || \"\").trim() || (this.props.logoUrl || \"\").trim();\n        return {\n          height: \"var(--logoh)\", width: \"var(--logow)\", display: \"block\", flexShrink: 0,\n          backgroundImage: url && url !== \"assets/chxtld-logo-brand.png\"\n            ? 'url(\"' + url + '\")'\n            : \"var(--logo-fallback)\",\n          backgroundSize: \"contain\", backgroundPosition: \"left bottom\", backgroundRepeat: \"no-repeat\"\n        };\n      })(),\n      syncLabel: this.state.syncing ? \"syncing\" : this.state.live ? \"live\" : \"demo data\",\n      syncStyle: \"display:var(--synctext);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;white-space:nowrap;flex-shrink:0;color:\" +\n        (this.state.live ? \"#4a7a4e\" : \"#b4453a\") + (this.state.syncing ? \";animation:decpulse 1.1s ease-in-out infinite\" : \"\"),\n      // narrow screens get the same signal as a dot, so the header can fit\n      syncDotStyle: \"display:var(--syncdot);width:8px;height:8px;border-radius:999px;flex-shrink:0;background:\" +\n        (this.state.live ? \"#4a7a4e\" : \"#b4453a\") + (this.state.syncing ? \";animation:decpulse 1.1s ease-in-out infinite\" : \"\"),\n      myLabel: me || \"sign in\",\n      myInitials: (me || \"?\").split(/\\s+/).map((w) => w[0]).join(\"\").slice(0, 2).toUpperCase(),\n      avatarStyle: \"width:20px;height:20px;border-radius:999px;background:#e38d54;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\",\n      openIdentity: () => this.setState({ identityOpen: true }),\n\n      filters,\n      cards,\n      isEmpty: cards.length === 0,\n      emptyTitle: L.length === 0 ? \"No decisions logged yet\"\n        : this.state.filter === \"resolved\" ? \"Nothing resolved yet\" : \"Nothing waiting on you\",\n      emptyBody: L.length === 0\n        ? \"Add a row to the DECISIONS tab of the project matrix — or tell Claude what needs deciding — and it shows up here.\"\n        : this.state.filter === \"resolved\"\n          ? \"Resolved decisions land here with the option that won and who called it.\"\n          : \"Everything in this state is clear. Try Everything to see the full list.\",\n\n      detail,\n      closeDetail: () => this.setState({ openId: null }),\n      stop: (e) => e.stopPropagation(),\n\n      commentRef: (el) => { this._comment = el; },\n      postComment: () => {\n        const el = this._comment;\n        const txt = el && el.value.trim();\n        if (!txt) return;\n        if (!me) { this.setState({ identityOpen: true }); return; }\n        const cur = L.filter((x) => x.id === this.state.openId)[0];\n        if (cur) this._patch({ ...cur, log: [...(cur.log || []), { at: \"just now\", who: me, role: this.state.myRole, type: \"comment\", value: txt }] });\n        el.value = \"\";\n        this._post({ action: \"postDecisionLog\", id: this.state.openId, who: me, role: this.state.myRole, type: \"comment\", value: txt },\n          (err) => { this._flash(err); if (!err) this._refetch(); });\n      },\n\n      numEdit: ne ? { scope: ne.scope, label: ne.label } : null,\n      numRef: (el) => {\n        this._num = el;\n        if (el && !el.dataset.seeded) {\n          el.dataset.seeded = \"1\";\n          el.value = ne && ne.current !== \"\" && ne.current !== undefined ? String(ne.current) : \"\";\n          setTimeout(() => { el.focus(); el.select(); }, 30);\n        }\n      },\n      closeNum: () => this.setState({ numEdit: null }),\n      saveNum: () => {\n        if (!ne) return;\n        const raw = (this._num && this._num.value) || \"\";\n        const val = Number(String(raw).replace(/[$,\\s]/g, \"\"));\n        if (isNaN(val)) { this._flash(\"that isn't a number\"); return; }\n        const cur = L.filter((x) => x.id === ne.id)[0];\n        if (cur) {\n          const key = ne.field === \"QTY\" ? \"qty\" : \"unitCost\";\n          this._patch({\n            ...cur,\n            options: (cur.options || []).map((o) => (o.option === ne.option ? { ...o, [key]: val, total: \"\" } : o)),\n            log: [...(cur.log || []), { at: \"just now\", who: me, role: this.state.myRole, type: \"edit\", value: ne.option + \" \" + ne.field.toLowerCase() + \" → \" + val }]\n          });\n        }\n        this.setState({ numEdit: null });\n        this._post({ action: \"setOptionField\", id: ne.id, option: ne.option, field: ne.field, value: val, who: me, role: this.state.myRole },\n          (err) => { this._flash(err); if (!err) this._refetch(); });\n      },\n\n      identityOpen: this.state.identityOpen,\n      nameRef: (el) => {\n        this._name = el;\n        if (el && !el.dataset.seeded) { el.dataset.seeded = \"1\"; el.value = me; }\n      },\n      roleChoices: roles.map((r) => ({\n        label: r,\n        onClick: () => this.setState({ roleDraft: r }),\n        style: \"display:inline-flex;align-items:center;min-height:var(--tap);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0 16px;border-radius:999px;transition:background 0.2s ease,color 0.2s ease;border:1.5px solid #000;\" +\n          (this.state.roleDraft === r ? \"background:#e38d54;border-color:#e38d54;color:#fff\" : \"background:transparent;color:#000\")\n      })),\n      saveIdentity: () => {\n        const nm = ((this._name && this._name.value) || \"\").trim();\n        if (!nm) { if (this._name) this._name.focus(); return; }\n        const rl = this.state.roleDraft || \"consultant\";\n        try { localStorage.setItem(\"hqWho\", nm); localStorage.setItem(\"hqRole\", rl); } catch (ignored) {}\n        this.setState({ me: nm, myRole: rl, identityOpen: false });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
